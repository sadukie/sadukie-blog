<h2>Posts</h2>
<ul>
    {% for post in site.posts %}
        {% if page.url contains "http" %}
        {% assign domain = '' %}
        {% elsif page.url contains "mailto" %}
            {% assign domain = '' %}
        {% else %}
            {% assign domain = site.url | append: site.baseurl %}
        {% endif %}
        <li>
            <a href="{{domain}}{{ post.url }}">{{ post.title }}</a>
        </li>
    {% endfor %}
</ul>
