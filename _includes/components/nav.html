<script>
(function () {
    var menu = document.currentScript.previousElementSibling.querySelector('.nav-menu');
    var wide = window.matchMedia('(min-width: 901px)');
    function syncMenu() {
        if (wide.matches) {
            menu.setAttribute('open', '');
        } else {
            menu.removeAttribute('open');
        }
    }
    syncMenu();
    wide.addEventListener('change', syncMenu);
})();
</script>
