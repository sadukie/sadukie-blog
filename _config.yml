baseurl: ""
title: The Adventures of Sadukie
description: "100% me, unapologetically"
remote_theme: just-the-docs/just-the-docs
search_enabled: true
search:
  heading_level: 3

plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
- jekyll-feed

defaults:
 -
  scope:
    path: ""
    type: "authors"
  values:
    layout: "author"
 -
  scope:
    path: ""
    type: "posts"
  values:
    layout: "post"
    author: "sadukie"