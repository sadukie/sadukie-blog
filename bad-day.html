<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>So you've had a bad day...</title>
        <style>
            body {
                margin: 0;
                padding: 16px;
            }
            h1 {
                overflow-wrap: break-word;
            }
            textarea {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                font-size: 16px;
            }
            button {
                padding: 10px 16px;
                font-size: 16px;
            }
            h1 span:nth-child(2n){
                font-family: "Comic Sans MS";
            }
            h1 span:nth-child(2n+1){
                font-family: "Papyrus";
            }
        </style>
        <script>
            function convertText(){
                var textToStylize = document.getElementById("textToStylize").value;   
                var tagToUpdate = document.getElementsByTagName("h1")[0];
                tagToUpdate.innerHTML = textToStylize.replace(/[a-zA-Z]/g,"<span>$&</span>").replaceAll("\n","<br />");    
            }
        </script>
    </head>
    <body>
        <h1>So you've had a bad day...</h1>
        <hr />        
        <form>
            <label for="textToStylize">Enter text to stylize...</label><br />
            <textarea id="textToStylize" rows="4" cols="120"></textarea><br />
            <button type="button" onclick="convertText();">Stylize</button>
        </form>
    </body>
</html>
